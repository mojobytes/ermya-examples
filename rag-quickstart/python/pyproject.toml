[project]
name = "ermya-rag-quickstart"
version = "0.1.0"
description = "Ermya RAG quickstart example (Python)"
requires-python = ">=3.10"
dependencies = [
    "ermya-vector==0.4.1",
    "requests>=2.31,<3",
    "oxidize-pdf>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "requests-mock>=1.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: marks tests as integration tests (deselect with -m 'not integration')",
]
